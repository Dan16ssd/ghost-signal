<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Signal</title>
<style>
  :root {
    --bg: #0d0f12; --ink: #d9dde3; --muted: #8a93a0;
    --body: #2a2f36; --body-edge: #151a1f; --key: #3a414b; --key-ink: #e6e9ee;
    --lcd: #9fbf6a; --lcd-dark: #8aab58; --lcd-ink: #1f2a12; --glow: #b6ff7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1b2230, var(--bg) 70%);
    color: var(--ink); font-family: system-ui, "Noto Sans Lao", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 18px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .08em; text-shadow: 0 0 12px rgba(182,255,122,.35); }
  .sub { margin: 0; color: var(--muted); text-align: center; max-width: 30rem; }
  .phone { width: 100%; max-width: 300px; background: linear-gradient(160deg, var(--body), var(--body-edge));
    border-radius: 48px 48px 60px 60px; padding: 28px 22px 30px; box-shadow: 0 20px 60px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.08); }
  .speaker { width: 60px; height: 6px; margin: 0 auto 14px; border-radius: 3px; background: #11151a; }
  .lcd { background: var(--lcd); border-radius: 10px; height: 270px; padding: 8px 10px; color: var(--lcd-ink);
    font-family: "Courier New", "Noto Sans Lao", monospace; font-size: 13px; display: flex; flex-direction: column;
    box-shadow: inset 0 0 0 3px var(--lcd-dark), 0 0 18px rgba(182,255,122,.15); }
  .bar { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid var(--lcd-dark);
    padding-bottom: 3px; margin-bottom: 4px; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .m { padding: 3px 6px; border: 1px solid var(--lcd-ink); border-radius: 4px; max-width: 92%; white-space: pre-wrap;
    word-break: break-word; }
  .me { align-self: flex-end; background: rgba(31,42,18,.08); }
  .them { align-self: flex-start; }
  .meta { font-size: 10px; opacity: .7; }
  .compose { display: flex; gap: 4px; border-top: 1px solid var(--lcd-dark); padding-top: 4px; }
  .compose input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--lcd-ink);
    font: inherit; outline: none; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 10px 0; background: var(--key); color: var(--key-ink);
    cursor: pointer; box-shadow: 0 3px 0 #1a1f25; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a1f25; }
  .send { background: #3f6b2a; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 34rem; }
  .examples button { padding: 6px 12px; font-size: .85rem; }
  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  footer { color: var(--muted); font-size: .8rem; text-align: center; max-width: 30rem; }
</style>
</head>
<body>
  <h1>👻 GHOST SIGNAL</h1>
  <p class="sub">No smartphone? No data? Text your question and the web texts back.
    This is a simulator of an old phone; the real service works by plain SMS.</p>

  <div class="phone" aria-label="Phone simulator">
    <div class="speaker"></div>
    <div class="lcd">
      <div class="bar"><span>▂▄▆ GHOST</span><span id="clock"></span><span>▮▮▮</span></div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="form">
        <input id="text" maxlength="480" placeholder="Type a question..." autocomplete="off" aria-label="Message">
      </form>
    </div>
    <div class="keys">
      <button type="button" data-ex="HELP">Help</button>
      <button type="button" data-clear>Clear</button>
      <button type="button" class="send" id="send">Send</button>
    </div>
  </div>

  <div class="examples" aria-label="Example messages">
    <button type="button" data-ex="How do I treat dengue fever?">Dengue fever</button>
    <button type="button" data-ex="WEATHER Vientiane">WEATHER Vientiane</button>
    <button type="button" data-ex="When was the Mekong bridge built?">Mekong bridge</button>
    <button type="button" data-ex="ໄຂ້ຍຸງລາຍ ແມ່ນຫຍັງ">ໄຂ້ຍຸງລາຍ (Lao)</button>
  </div>

  <footer>Answers come from Wikipedia and Open-Meteo. For health questions, always see a health worker.</footer>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('text');
  const clock = document.getElementById('clock');
  setInterval(() => { clock.textContent = new Date().toTimeString().slice(0, 5); }, 1000);
  clock.textContent = new Date().toTimeString().slice(0, 5);

  function add(text, who, meta) {
    const div = document.createElement('div');
    div.className = 'm ' + who;
    div.textContent = text;
    if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; div.appendChild(m); }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return;
    input.value = '';
    add(text, 'me');
    const wait = add('receiving', 'them');
    wait.classList.add('blink');
    try {
      const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }) });
      const data = await r.json();
      wait.remove();
      add(data.reply, 'them', data.segments ? `${data.segments} SMS · ${data.encoding}` : '');
    } catch (e) {
      wait.remove();
      add('No signal. Try again.', 'them');
    }
  }

  document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); send(input.value); });
  document.getElementById('send').addEventListener('click', () => send(input.value));
  document.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => send(b.dataset.ex)));
  document.querySelector('[data-clear]').addEventListener('click', () => { log.innerHTML = ''; });
  add('Text a question. Send HELP for commands.', 'them');
</script>
</body>
</html>
