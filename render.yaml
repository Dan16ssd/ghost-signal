# Render blueprint: one Docker web service. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: ghost-signal
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GHOST_CONTACT
        value: https://github.com/Dan16ssd/ghost-signal
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
